name: CI

on:
  push:
    branches:
      - main
      - monorepo-migration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.29.1

jobs:
  platform:
    name: Platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum
      - run: go test ./...
      - run: go vet ./...

  infra-backend:
    name: infra_link backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/infra_link/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/infra_link/backend/go.mod
          cache-dependency-path: apps/infra_link/backend/go.sum
      - run: go test ./...
      - run: go vet ./...

  web:
    name: TypeScript workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @codelinks/contracts check
      - run: pnpm --filter @codelinks/auth-client check
      - run: pnpm --filter @codelinks/startseite check
      - run: pnpm --filter @codelinks/planer-link check
      - run: pnpm --filter @codelinks/infra-link-frontend check
      - run: pnpm --filter @codelinks/planer-link test
      - run: pnpm --filter @codelinks/infra-link-frontend test
      - run: pnpm --filter @codelinks/startseite build

  docker-build:
    name: Docker images
    runs-on: ubuntu-latest
    needs:
      - platform
      - infra-backend
      - web
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t codelinks/platform-api:ci ./platform
      - run: docker build --target runtime -t codelinks/infra-backend:ci ./apps/infra_link/backend
      - run: docker build --target runtime -t codelinks/infra-frontend:ci ./apps/infra_link/frontend
      - run: docker build -f deploy/docker/planer-link.Dockerfile -t codelinks/planer-web:ci .
      - run: docker build -f apps/startseite/Dockerfile -t codelinks/startseite:ci .
