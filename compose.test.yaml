name: codelinks-test

services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: codelinks_auth_test
      POSTGRES_USER: codelinks
      POSTGRES_PASSWORD: codelinks
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelinks -d codelinks_auth_test"]
      interval: 1s
      timeout: 5s
      retries: 30
