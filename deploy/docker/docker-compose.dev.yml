services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: codelinks_auth
      POSTGRES_USER: codelinks
      POSTGRES_PASSWORD: codelinks
    ports:
      - "5432:5432"
    volumes:
      - codelinks-postgres:/var/lib/postgresql/data
      - ../../apps/auth-service/backend/migrations:/docker-entrypoint-initdb.d:ro

  auth-service:
    image: golang:1.26-alpine
    working_dir: /workspace/apps/auth-service/backend
    command: sh -c "go mod download && go run ."
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://codelinks:codelinks@postgres:5432/codelinks_auth?sslmode=disable
      JWT_ISSUER: http://auth.codelinks.localhost
      JWT_AUDIENCE: codelinks-products
      COOKIE_DOMAIN: .codelinks.localhost
      ALLOWED_ORIGINS: http://code-links.codelinks.localhost,http://auth.codelinks.localhost
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    volumes:
      - ../..:/workspace

  infra-link-api:
    image: golang:1.26-alpine
    working_dir: /workspace/apps/infra-link/backend
    command: sh -c "go mod download && go run ."
    environment:
      PORT: "8091"
      PRODUCT_ID: infra-link
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      JWT_ISSUER: http://auth.codelinks.localhost
      JWT_AUDIENCE: codelinks-products
    depends_on:
      - auth-service
    ports:
      - "8091:8091"
    volumes:
      - ../..:/workspace

  planer-link-api:
    image: golang:1.26-alpine
    working_dir: /workspace/apps/planer-link/backend
    command: sh -c "go mod download && go run ."
    environment:
      PORT: "8092"
      PRODUCT_ID: planer-link
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      JWT_ISSUER: http://auth.codelinks.localhost
      JWT_AUDIENCE: codelinks-products
    depends_on:
      - auth-service
    ports:
      - "8092:8092"
    volumes:
      - ../..:/workspace

  loka-link-api:
    image: golang:1.26-alpine
    working_dir: /workspace/apps/loka-link/backend
    command: sh -c "go mod download && go run ."
    environment:
      PORT: "8093"
      PRODUCT_ID: loka-link
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      JWT_ISSUER: http://auth.codelinks.localhost
      JWT_AUDIENCE: codelinks-products
    depends_on:
      - auth-service
    ports:
      - "8093:8093"
    volumes:
      - ../..:/workspace

  code-links-web:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && corepack pnpm install && corepack pnpm --filter code-links dev --host 0.0.0.0"
    environment:
      PUBLIC_AUTH_BASE_URL: http://auth.codelinks.localhost
    ports:
      - "5173:5173"
    volumes:
      - ../..:/workspace

  auth-frontend:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && corepack pnpm install && corepack pnpm --filter @codelinks/auth-frontend dev --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    volumes:
      - ../..:/workspace

  infra-link-web:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && corepack pnpm install && corepack pnpm --filter @codelinks/infra-link-frontend dev --host 0.0.0.0 --port 5175"
    ports:
      - "5175:5175"
    volumes:
      - ../..:/workspace

  planer-link-web:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && corepack pnpm install && corepack pnpm --filter @codelinks/planer-link-frontend dev --host 0.0.0.0 --port 5176"
    ports:
      - "5176:5176"
    volumes:
      - ../..:/workspace

  loka-link-web:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && corepack pnpm install && corepack pnpm --filter @codelinks/loka-link-frontend dev --host 0.0.0.0 --port 5177"
    ports:
      - "5177:5177"
    volumes:
      - ../..:/workspace

  caddy:
    image: caddy:2-alpine
    depends_on:
      - code-links-web
      - auth-frontend
      - infra-link-web
      - planer-link-web
      - loka-link-web
      - auth-service
      - infra-link-api
      - planer-link-api
      - loka-link-api
    ports:
      - "80:80"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  codelinks-postgres:
