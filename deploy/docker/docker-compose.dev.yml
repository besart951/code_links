name: codelinks-dev

services:
  caddy:
    image: caddy:2.11.2-alpine
    ports:
      - "80:80"
    volumes:
      - ../caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_dev_data:/data
      - caddy_dev_config:/config
    depends_on:
      - startseite
      - platform-api
      - infra-frontend
      - infra-backend
      - planer-web
    restart: unless-stopped

  postgres:
    image: postgres:18.3-alpine3.23
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      CODELINKS_PLATFORM_DB_PASSWORD: ${CODELINKS_PLATFORM_DB_PASSWORD:-platform_dev_password}
      CODELINKS_INFRA_LINK_DB_PASSWORD: ${CODELINKS_INFRA_LINK_DB_PASSWORD:-infra_dev_password}
      CODELINKS_PLANER_LINK_DB_PASSWORD: ${CODELINKS_PLANER_LINK_DB_PASSWORD:-planer_dev_password}
      CODELINKS_LOKA_LINK_DB_PASSWORD: ${CODELINKS_LOKA_LINK_DB_PASSWORD:-loka_dev_password}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  platform-migrate:
    build:
      context: ../../platform
      dockerfile: Dockerfile
      target: runtime
    command: ["platform-migrate"]
    environment:
      DATABASE_URL: postgres://codelinks_platform:${CODELINKS_PLATFORM_DB_PASSWORD:-platform_dev_password}@postgres:5432/codelinks_platform?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  platform-api:
    build:
      context: ../../platform
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://codelinks_platform:${CODELINKS_PLATFORM_DB_PASSWORD:-platform_dev_password}@postgres:5432/codelinks_platform?sslmode=disable
      JWT_SECRET: ${PLATFORM_JWT_SECRET:-dev-only-change-me-change-in-prod}
      JWT_ISSUER: codelinks-platform
      PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN:-dev-internal-token}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.codelinks.localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  platform-seed:
    build:
      context: ../../platform
      dockerfile: Dockerfile
      target: runtime
    command: ["platform-seed"]
    environment:
      DATABASE_URL: postgres://codelinks_platform:${CODELINKS_PLATFORM_DB_PASSWORD:-platform_dev_password}@postgres:5432/codelinks_platform?sslmode=disable
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      SEED_USER_DISPLAY_NAME: ${SEED_USER_DISPLAY_NAME:-CodeLinks Admin}
      SEED_TENANT_NAME: ${SEED_TENANT_NAME:-CodeLinks}
      SEED_TENANT_SLUG: ${SEED_TENANT_SLUG:-codelinks}
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
    profiles:
      - seed
    restart: "no"

  infra-migrate:
    build:
      context: ../../apps/infra_link/backend
      dockerfile: Dockerfile
      target: bootstrap
    environment:
      DATABASE_URL: host=postgres user=codelinks_infra_link password=${CODELINKS_INFRA_LINK_DB_PASSWORD:-infra_dev_password} dbname=codelinks_infra_link port=5432 sslmode=disable
      JWT_SECRET: ${INFRA_JWT_SECRET:-dev-infra-jwt-secret-change-me}
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  infra-backend:
    build:
      context: ../../apps/infra_link/backend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: host=postgres user=codelinks_infra_link password=${CODELINKS_INFRA_LINK_DB_PASSWORD:-infra_dev_password} dbname=codelinks_infra_link port=5432 sslmode=disable
      JWT_SECRET: ${INFRA_JWT_SECRET:-dev-infra-jwt-secret-change-me}
      APP_ENV: production
      PLATFORM_URL: http://platform-api:8080
      PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN:-dev-internal-token}
      PLATFORM_ENTITLEMENTS_REQUIRED: ${PLATFORM_ENTITLEMENTS_REQUIRED:-true}
    depends_on:
      infra-migrate:
        condition: service_completed_successfully
      platform-api:
        condition: service_started
    restart: unless-stopped

  infra-frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/infra-link-frontend.Dockerfile
    ports:
      - "127.0.0.1:5174:80"
    environment:
      BACKEND_UPSTREAM: infra-backend:8080
    depends_on:
      infra-backend:
        condition: service_started
    restart: unless-stopped

  planer-web:
    build:
      context: ../..
      dockerfile: deploy/docker/planer-link.Dockerfile
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      DATABASE_URL: postgres://codelinks_planer_link:${CODELINKS_PLANER_LINK_DB_PASSWORD:-planer_dev_password}@postgres:5432/codelinks_planer_link?sslmode=disable
      PLATFORM_URL: http://platform-api:8080
      PLATFORM_ENTITLEMENTS_REQUIRED: ${PLATFORM_ENTITLEMENTS_REQUIRED:-true}
      NODE_ENV: production
      PORT: 3000
      APP_BASE_PATH: ""
    depends_on:
      postgres:
        condition: service_healthy
      platform-api:
        condition: service_started
    restart: unless-stopped

  startseite:
    build:
      context: ../..
      dockerfile: apps/startseite/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_SITE_URL: http://codelinks.localhost
    restart: unless-stopped

volumes:
  postgres_dev_data:
  caddy_dev_data:
  caddy_dev_config:
